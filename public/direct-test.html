<!DOCTYPE html>
<html>
<head>
    <title>Direct CouchDB Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .output { background: #f5f5f5; padding: 15px; margin: 10px 0; white-space: pre-wrap; border-radius: 5px; }
        .success { background: #d4edda; border-left: 4px solid #28a745; }
        .error { background: #f8d7da; border-left: 4px solid #dc3545; }
        button { padding: 10px 20px; margin: 5px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔍 CouchDB Connection Test</h1>
    <p>Testing direct connection to: <strong>http://10.24.2.131:5984/member_management</strong></p>
    
    <button onclick="testFetch()">Test Fetch API</button>
    <button onclick="testWithCredentials()">Test with Credentials</button>
    <button onclick="testPouchDB()">Test PouchDB</button>
    
    <div id="output"></div>

    <script src="https://cdn.jsdelivr.net/npm/pouchdb@8.0.1/dist/pouchdb.min.js"></script>
    
    <script>
        const output = document.getElementById('output');
        
        function log(title, message, isError = false) {
            const div = document.createElement('div');
            div.className = 'output ' + (isError ? 'error' : 'success');
            div.innerHTML = `<strong>${title}</strong>\n${message}`;
            output.appendChild(div);
            console.log(title, message);
        }

        async function testFetch() {
            output.innerHTML = '';
            log('🧪 Test 1: Basic Fetch', 'Testing fetch to CouchDB...');
            
            try {
                const url = 'http://10.24.2.131:5984/member_management';
                const auth = btoa('admin:password');
                
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Basic ${auth}`,
                        'Content-Type': 'application/json'
                    },
                    mode: 'cors'
                });
                
                const data = await response.json();
                log('✅ Fetch Success!', 
                    `Status: ${response.status}\n` +
                    `Database: ${data.db_name}\n` +
                    `Docs: ${data.doc_count}\n` +
                    `Headers:\n${JSON.stringify(Object.fromEntries(response.headers), null, 2)}`
                );
            } catch (error) {
                log('❌ Fetch Failed', 
                    `Error: ${error.message}\n` +
                    `Name: ${error.name}\n\n` +
                    `This means the browser is blocking the request.\n` +
                    `Possible reasons:\n` +
                    `1. CORS preflight (OPTIONS) failed\n` +
                    `2. Network/Firewall blocking\n` +
                    `3. Browser security policy`,
                    true
                );
            }
        }

        async function testWithCredentials() {
            output.innerHTML = '';
            log('🧪 Test 2: Fetch with Credentials', 'Testing with credentials: include...');
            
            try {
                const url = 'http://10.24.2.131:5984/member_management';
                const auth = btoa('admin:password');
                
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Basic ${auth}`
                    },
                    mode: 'cors',
                    credentials: 'include'
                });
                
                const data = await response.json();
                log('✅ Success with Credentials!', 
                    `Database: ${data.db_name}\n` +
                    `Docs: ${data.doc_count}`
                );
            } catch (error) {
                log('❌ Failed with Credentials', error.message, true);
            }
        }

        async function testPouchDB() {
            output.innerHTML = '';
            log('🧪 Test 3: PouchDB Connection', 'Testing PouchDB library...');
            
            try {
                const db = new PouchDB('http://admin:password@10.24.2.131:5984/member_management', {
                    skip_setup: false,
                    ajax: {
                        timeout: 30000,
                        cache: false
                    }
                });
                
                log('PouchDB Created', 'Getting database info...');
                
                const info = await db.info();
                log('✅ PouchDB Success!', 
                    `Database: ${info.db_name}\n` +
                    `Docs: ${info.doc_count}\n` +
                    `Update Seq: ${info.update_seq}`
                );
            } catch (error) {
                log('❌ PouchDB Failed', 
                    `Error: ${error.message}\n` +
                    `Name: ${error.name}\n` +
                    `Status: ${error.status || 'undefined'}\n\n` +
                    `Stack: ${error.stack}`,
                    true
                );
            }
        }
    </script>
</body>
</html>
